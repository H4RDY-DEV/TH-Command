<!doctype html>
<h1>Jobs</h1>
<table id="jobs">
<thead><tr><th>Reference</th><th>Client</th><th>Status</th><th>Date</th></tr></thead>
<tbody></tbody>
</table>
<script type="module">
import {loadJobs} from '../../services/jobs.service.js';
const jobs=await loadJobs();
document.querySelector('#jobs tbody').innerHTML=
jobs.map(j=>`<tr><td>${j.reference}</td><td>${j.client}</td><td>${j.status}</td><td>${j.event_date}</td></tr>`).join('');
</script>
